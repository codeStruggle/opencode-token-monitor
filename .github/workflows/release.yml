name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:binaries
      - run: node --test tests/node/cli.test.mjs
      - name: Assemble flat release assets with checksums
        run: |
          mkdir release
          npm pack --pack-destination release
          cp dist/opencode-token-monitor.js release/
          cp dist/bin/* release/
          cp install.sh install.ps1 verify.sh verify.ps1 uninstall.sh uninstall.ps1 release/
          (cd release && sha256sum * > checksums.txt)
          cat release/checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
